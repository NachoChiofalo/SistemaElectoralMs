<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Sistema Electoral - Administración</title>
    <link rel="preload" href="/assets/fonts/inter-latin-400-normal.woff2?v=dd05e326" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/inter-latin-600-normal.woff2?v=62553d15" as="font" type="font/woff2" crossorigin>
    <!-- Antes del primer pintado: si se aplicara despues, el tema oscuro destellaria en blanco. -->
    <script src="src/tema.js?v=2e769770"></script>
    <link rel="stylesheet" href="src/styles/fonts.css?v=5bd875d5">
    <link rel="stylesheet" href="src/styles/icons.css?v=aabbf556">
    <link rel="stylesheet" href="src/styles/design-system.css?v=6d516238">
    <link rel="stylesheet" href="src/styles/navbar-styles.css?v=23619bcd">
    <link rel="stylesheet" href="src/styles/padron-styles.css?v=d44e31d4">
    <link rel="stylesheet" href="src/styles/detalle-votante-styles.css?v=388ab44b">
    <link rel="stylesheet" href="src/styles/login-styles.css?v=5343e6d7">
    <style>
        /* Touch-friendly improvements */
        .nav-btn, .logout-btn {
            cursor: pointer;
            -webkit-tap-highlight-color: rgba(0, 0, 0, 0.1);
        }

        /* Accessibility improvements */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* High contrast mode support */
        @media (prefers-contrast: high) {
            .nav-btn, .logout-btn {
                border: 2px solid currentColor;
            }
        }

        body {
            font-family: var(--ds-font-family);
            background-color: var(--ds-bg-page);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .app-main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Padron navigation buttons */
        .padron-nav-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .padron-nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            font-family: var(--ds-font-family);
            transition: all 0.3s ease;
            font-size: 14px;
            border: none;
        }

        .padron-nav-btn-back {
            background: var(--ds-bg-subtle);
            color: var(--ds-text-secondary);
            border: 1px solid var(--ds-border-default);
        }

        .padron-nav-btn-back:hover {
            background: var(--ds-secondary-200);
            border-color: var(--ds-border-strong);
            transform: translateY(-1px);
        }

        .padron-nav-btn-results {
            background: var(--ds-gradient-primary);
            color: var(--ds-text-inverse);
            box-shadow: 0 2px 10px rgba(99, 102, 241, 0.25);
        }

        .padron-nav-btn-results:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        @media (max-width: 768px) {
            .padron-nav-buttons {
                flex-direction: column;
                gap: 8px;
            }
            .padron-nav-btn {
                width: 100%;
                justify-content: center;
                padding: 12px 16px;
                min-height: 44px;
            }
        }
    </style>
</head>
<body>

    <!-- Barra de navegación unificada -->
    <div id="navbar-container"></div>

    <main class="app-main" role="main">
        <!-- Sección de Padrón Electoral -->
        <section id="padron" class="section active" role="region" aria-label="Gestión de Padrón Electoral">
            <!-- Acá había dos botones, "Volver al Dashboard" y "Ver Resultados". Los dos
                 son destinos de la barra de navegación desde el rediseño, así que
                 duplicaban un enlace que ya está tres centímetros más arriba. -->
            <div id="padron-container" class="padron-electoral-container">
                <!-- El contenido será generado por JavaScript -->
            </div>
        </section>

        <!-- Secciones futuras -->
        <section id="resultados" class="section" role="region" aria-label="Resultados electorales">
            <div class="coming-soon">
                <i class="fas fa-chart-bar" aria-hidden="true"></i>
                <h2>Módulo de Resultados</h2>
                <p>Este módulo estará disponible próximamente</p>
            </div>
        </section>

        <section id="reportes" class="section" role="region" aria-label="Generación de reportes">
            <div class="coming-soon">
                <i class="fas fa-file-alt" aria-hidden="true"></i>
                <h2>Módulo de Reportes</h2>
                <p>Este módulo estará disponible próximamente</p>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="src/components/NavbarComponent.js?v=ab118bd1"></script>
    <script src="src/services/ApiService.js?v=e512aeca"></script>
    <script src="src/services/AuthService.js?v=dbc5042e"></script>
    <script src="src/components/LoginComponent.js?v=4dd0f130"></script>
    <script src="src/components/DetalleVotanteComponent.js?v=94f459cf"></script>
    <script src="src/components/PadronComponent.js?v=2bfd09e7"></script>
    <script src="src/app.js?v=73e4e7eb"></script>
    <script>
        // Inicializar barra de navegación unificada
        document.addEventListener('DOMContentLoaded', function() {
            if (window.navbarComponent && typeof window.navbarComponent.init === 'function') {
                window.navbarComponent.init('navbar-container', 'padron');
            }
        });
    </script>
</body>
</html>
