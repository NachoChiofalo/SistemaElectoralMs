<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados del Relevamiento - Sistema Electoral</title>
    
    <!-- Tipografia e iconos, servidos desde este mismo origen -->
    <link rel="preload" href="/assets/fonts/inter-latin-400-normal.woff2?v=dd05e326" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/inter-latin-600-normal.woff2?v=62553d15" as="font" type="font/woff2" crossorigin>
    <!-- Antes del primer pintado: si se aplicara despues, el tema oscuro destellaria en blanco. -->
    <script src="src/tema.js?v=2e769770"></script>
    <script src="src/lib/escapar.js?v=e0153e84"></script>
    <link rel="stylesheet" href="src/styles/fonts.css?v=5bd875d5">
    <link rel="stylesheet" href="src/styles/icons.css?v=4119dcbe">
    
    <!-- Design System -->
    <link rel="stylesheet" href="src/styles/design-system.css?v=6d516238">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="src/styles/navbar-styles.css?v=23619bcd">
    <link rel="stylesheet" href="src/styles/padron-styles.css?v=b46b6c26">
    <link rel="stylesheet" href="src/styles/resultados-styles.css?v=c2e86182">
    <link rel="stylesheet" href="src/styles/microchart.css?v=aadaea89">
    
    <style>
        body {
            font-family: var(--ds-font-family);
            background-color: var(--ds-bg-page);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            background: var(--ds-gradient-primary);
            color: var(--ds-text-inverse);
            text-decoration: none;
            border-radius: var(--ds-radius-md);
            font-weight: 600;
            font-family: var(--ds-font-family);
            margin-bottom: 20px;
            transition: all var(--ds-transition-smooth);
            border: none;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(99, 102, 241, 0.25);
        }
        
        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }
        
        .back-btn i {
            font-size: 1rem;
        }

        .nav-link {
            transition: background-color 0.3s ease;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
            touch-action: manipulation;
        }
    
        
        .nav-link:hover {
            background-color: var(--ds-bg-subtle);
        }
        
        .nav-link.active {
            background-color: var(--ds-primary-500);
            color: var(--ds-on-primary);
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            min-height: 44px;
            touch-action: manipulation;
        }
        
        .btn-primary {
            background-color: var(--ds-primary-500);
            color: var(--ds-on-primary);
        }
        
        .btn-primary:hover {
            background-color: var(--ds-primary-600);
        }
        
        .btn-secondary {
            background-color: var(--ds-secondary-400);
            color: var(--ds-text-inverse);
        }
        
        .btn-secondary:hover {
            background-color: var(--ds-text-muted);
        }
        
        /* Mobile First Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: 5px;
            }

            .container {
                padding: 0 10px;
            }

            .back-btn {
                width: 100%;
                justify-content: center;
                padding: 12px 16px;
                font-size: 14px;
            }
            
            .navigation {
                padding: 10px 15px;
                margin-bottom: 10px;
                border-radius: 8px;
            }
            
            .nav-links {
                gap: 8px;
                justify-content: space-between;
            }
            
            .nav-link {
                padding: 8px 12px;
                font-size: 12px;
                min-height: 40px;
            }
            
            .nav-link i {
                font-size: 16px;
            }
            
            .btn {
                padding: 10px 16px;
                font-size: 13px;
                min-height: 40px;
            }
        }
        
        @media (max-width: 480px) {
            .nav-links {
                flex-direction: column;
                gap: 5px;
            }
            
            .nav-link {
                width: 100%;
                justify-content: center;
                text-align: center;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Barra de navegación unificada -->
    <div id="navbar-container"></div>

    <div class="container">
        <!-- Botón para regresar al Dashboard -->
        <button class="back-btn" onclick="window.location.href='dashboard.html'">
            <i class="fas fa-arrow-left"></i>
            Volver al Dashboard
        </button>
        
        <!-- Contenedor de Resultados -->
        <div id="resultados-container">
            <!-- El componente se cargará aquí -->
        </div>
    </div>

    <!-- Graficos: reemplaza a Chart.js, misma API, solo doughnut y bar -->
    <script src="src/lib/microchart.js?v=d26ab0a4"></script>

    <!-- Servicios y Componentes -->
    <script src="src/components/NavbarComponent.js?v=b370bbc8"></script>
    <script src="src/services/ApiService.js?v=32a50499"></script>
    <script src="src/services/AuthService.js?v=dbc5042e"></script>
    <script src="src/components/ResultadosComponent.js?v=e5f812e8"></script>
    
    <script>
        // Inicializar componente cuando la página esté lista
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🚀 Iniciando aplicación de Resultados...');

            // Inicializar navbar
            if (window.navbarComponent && typeof window.navbarComponent.init === 'function') {
                window.navbarComponent.init('navbar-container', 'resultados');
            }
            
            try {
                // Verificar autenticación
                const isAuthenticated = await window.authService.init();
                
                if (!isAuthenticated) {
                    window.location.href = 'dashboard.html';
                    return;
                }
                
                // Cargar permisos del usuario
                let userPermissions = [];
                try {
                    const userInfo = await window.apiService.request('/api/auth/me');
                    userPermissions = (userInfo && userInfo.data && Array.isArray(userInfo.data.permisos))
                        ? userInfo.data.permisos
                        : [];
                    console.log('✅ Permisos del usuario cargados:', userPermissions);
                } catch (error) {
                    console.error('❌ Error al cargar permisos del usuario:', error);
                }
                
                // Verificar si tiene permisos para ver resultados
                if (!userPermissions.includes('resultados.view')) {
                    console.log('❌ Usuario sin permisos para ver resultados');
                    document.getElementById('resultados-container').innerHTML = `
                        <div class="error-container" style="display: block; max-width: 600px; margin: 50px auto; padding: 30px; background: var(--ds-bg-card); border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center;">
                            <div class="error-message" style="color: var(--ds-danger-500);">
                                <i class="fas fa-lock" style="font-size: 48px; margin-bottom: 20px;"></i>
                                <h3 style="margin: 0 0 15px; font-size: 24px;">Acceso Denegado</h3>
                                <p style="margin: 0 0 25px; font-size: 16px; color: var(--ds-text-secondary);">No tiene permisos para acceder a los resultados del relevamiento.</p>
                                <button onclick="window.location.href='dashboard.html'" class="btn btn-primary" style="display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px; background: var(--ds-gradient-primary); color: var(--ds-text-inverse); border: none; border-radius: var(--ds-radius-md); font-weight: 600; cursor: pointer; text-decoration: none;">
                                    <i class="fas fa-arrow-left"></i> Volver al Dashboard
                                </button>
                            </div>
                        </div>
                    `;
                    return;
                }
                
                console.log('✅ Usuario autenticado con permisos para resultados');
                
                // Inicializar componente de resultados
                const exito = await window.resultadosComponent.init('resultados-container');
                
                if (exito) {
                    console.log('✅ Aplicación de Resultados iniciada correctamente');
                } else {
                    console.error('❌ Error iniciando la aplicación');
                }
                
            } catch (error) {
                console.error('❌ Error fatal:', error);
                
                // Mostrar error en la página
                const container = document.getElementById('resultados-container');
                container.innerHTML = `
                    <div class="error-container" style="display: block;">
                        <div class="error-message">
                            <i class="fas fa-exclamation-triangle"></i>
                            <h3>Error Fatal</h3>
                            <p>No se pudo cargar la aplicación: ${error.message}</p>
                            <p style="margin-top: 15px;">
                                <button onclick="location.reload()" class="btn btn-primary">
                                    <i class="fas fa-redo"></i> Reintentar
                                </button>
                            </p>
                        </div>
                    </div>
                `;
            }
        });
        
        // Manejar errores globales
        window.addEventListener('error', (event) => {
            console.error('❌ Error global:', event.error);
        });
        
        window.addEventListener('unhandledrejection', (event) => {
            console.error('❌ Promesa rechazada:', event.reason);
        });
    </script>
</body>
</html>
