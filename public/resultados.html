<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados del Relevamiento - ÁGORA</title>
    <link rel="icon" type="image/png" href="/assets/images/agora-icon.png">
    
    <!-- Tipografia e iconos, servidos desde este mismo origen -->
    <link rel="preload" href="/assets/fonts/inter-latin-400-normal.woff2?v=dd05e326" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/inter-latin-600-normal.woff2?v=62553d15" as="font" type="font/woff2" crossorigin>
    <!-- Antes del primer pintado: si se aplicara despues, el tema oscuro destellaria en blanco. -->
    <script src="src/tema.js?v=2e769770"></script>
    <script src="src/lib/escapar.js?v=e0153e84"></script>
    <link rel="stylesheet" href="src/styles/fonts.css?v=5bd875d5">
    <link rel="stylesheet" href="src/styles/icons.css?v=4d484de8">
    
    <!-- Design System -->
    <link rel="stylesheet" href="src/styles/design-system.css?v=fd59067b">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="src/styles/navbar-styles.css?v=482f8826">
    <link rel="stylesheet" href="src/styles/padron-styles.css?v=01aec78a">
    <link rel="stylesheet" href="src/styles/resultados-styles.css?v=1466e36d">
    <link rel="stylesheet" href="src/styles/microchart.css?v=aadaea89">
    
    <style>
        body {
            font-family: var(--ds-font-family);
            background-color: var(--ds-bg-page);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            background: var(--ds-gradient-primary);
            color: var(--ds-text-inverse);
            text-decoration: none;
            border-radius: var(--ds-radius-md);
            font-weight: 600;
            font-family: var(--ds-font-family);
            margin-bottom: 20px;
            transition: all var(--ds-transition-smooth);
            border: none;
            cursor: pointer;
            box-shadow: 0 2px 10px color-mix(in srgb, var(--ds-primary-600) 25%, transparent);
        }
        
        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px color-mix(in srgb, var(--ds-primary-600) 40%, transparent);
        }
        
        .back-btn i {
            font-size: 1rem;
        }

        .nav-link {
            transition: background-color 0.3s ease;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
            touch-action: manipulation;
        }
    
        
        .nav-link:hover {
            background-color: var(--ds-bg-subtle);
        }
        
        .nav-link.active {
            background-color: var(--ds-primary-500);
            color: var(--ds-on-primary);
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            min-height: 44px;
            touch-action: manipulation;
        }
        
        .btn-primary {
            background-color: var(--ds-primary-500);
            color: var(--ds-on-primary);
        }
        
        .btn-primary:hover {
            background-color: var(--ds-primary-600);
        }
        
        .btn-secondary {
            background-color: var(--ds-secondary-400);
            color: var(--ds-text-inverse);
        }
        
        .btn-secondary:hover {
            background-color: var(--ds-text-muted);
        }
        
        /* Mobile First Responsive Design */
        @media (max-width: 768px) {
            body {
                padding: 5px;
            }

            .container {
                padding: 0 10px;
            }

            .back-btn {
                width: 100%;
                justify-content: center;
                padding: 12px 16px;
                font-size: 14px;
            }
            
            .navigation {
                padding: 10px 15px;
                margin-bottom: 10px;
                border-radius: 8px;
            }
            
            .nav-links {
                gap: 8px;
                justify-content: space-between;
            }
            
            .nav-link {
                padding: 8px 12px;
                font-size: 12px;
                min-height: 40px;
            }
            
            .nav-link i {
                font-size: 16px;
            }
            
            .btn {
                padding: 10px 16px;
                font-size: 13px;
                min-height: 40px;
            }
        }
        
        @media (max-width: 480px) {
            .nav-links {
                flex-direction: column;
                gap: 5px;
            }
            
            .nav-link {
                width: 100%;
                justify-content: center;
                text-align: center;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Barra de navegación unificada -->
    <div id="navbar-container"></div>

    <div class="container">
        <!-- Botón para regresar al Dashboard -->
        <button class="back-btn" data-action="volver-dashboard">
            <i class="fas fa-arrow-left"></i>
            Volver al Dashboard
        </button>
        
        <!-- Contenedor de Resultados -->
        <div id="resultados-container" aria-live="polite">
            <!-- El componente se cargará aquí -->
        </div>
    </div>

    <!-- Graficos: reemplaza a Chart.js, misma API, solo doughnut y bar -->
    <script src="src/lib/microchart.js?v=265cf6c7"></script>

    <!-- Servicios y Componentes -->
    <script src="src/components/NavbarComponent.js?v=5f19dd0d"></script>
    <script src="src/lib/opciones.js?v=c7d76c08"></script>
    <script src="src/services/ApiService.js?v=1ccf812f"></script>
    <script src="src/services/AuthService.js?v=c07d343e"></script>
    <script src="src/components/ResultadosComponent.js?v=ef4c0826"></script>
    <script src="src/pages/resultados.js?v=3883967a"></script>
</body>
</html>
