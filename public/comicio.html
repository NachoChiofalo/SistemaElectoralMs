<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Comicio - Sistema Electoral</title>
    <link rel="preload" href="/assets/fonts/inter-latin-400-normal.woff2?v=dd05e326" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/inter-latin-600-normal.woff2?v=62553d15" as="font" type="font/woff2" crossorigin>
    <!-- Antes del primer pintado: si se aplicara despues, el tema oscuro destellaria en blanco. -->
    <script src="src/tema.js?v=2e769770"></script>
    <link rel="stylesheet" href="src/styles/fonts.css?v=5bd875d5">
    <link rel="stylesheet" href="src/styles/icons.css?v=aabbf556">
    <link rel="stylesheet" href="src/styles/design-system.css?v=6d516238">
    <link rel="stylesheet" href="src/styles/navbar-styles.css?v=23619bcd">
    <link rel="stylesheet" href="src/styles/padron-styles.css?v=d44e31d4">
    <style>
        body {
            font-family: var(--ds-font-family);
            background-color: var(--ds-bg-page);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .coming-soon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 60vh;
            color: var(--ds-text-muted);
        }
        
        .coming-soon i {
            font-size: 4rem;
            margin-bottom: 20px;
            color: var(--ds-primary-500);
            filter: drop-shadow(0 4px 8px rgba(99, 102, 241, 0.3));
        }
        
        .coming-soon h2 {
            margin: 0 0 15px 0;
            font-size: 2rem;
            color: var(--ds-text-primary);
        }
        
        .coming-soon p {
            font-size: 1.1rem;
            margin: 0;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <!-- Barra de navegación unificada -->
    <div id="navbar-container"></div>
    <div class="container">
        <div class="coming-soon">
            <i class="fas fa-building"></i>
            <h2>Gestión de Comicio</h2>
            <p>Próximamente</p>
        </div>
    </div>
    <script src="src/components/NavbarComponent.js?v=ab118bd1"></script>
    <script>
        // Inicializar barra de navegación unificada
        document.addEventListener('DOMContentLoaded', function() {
            if (window.navbarComponent && typeof window.navbarComponent.init === 'function') {
                window.navbarComponent.init('navbar-container', 'comicio');
            }
        });
    </script>
</body>
</html>
