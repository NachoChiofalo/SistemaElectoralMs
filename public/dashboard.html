<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ÁGORA</title>
    <link rel="icon" type="image/png" href="/assets/images/agora-icon.png">
    
    <!-- Tipografia e iconos, servidos desde este mismo origen -->
    <link rel="preload" href="/assets/fonts/geist-sans-latin-400-normal.woff2?v=e6ef6abb" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/geist-sans-latin-600-normal.woff2?v=9d99fbd7" as="font" type="font/woff2" crossorigin>
    <!-- Antes del primer pintado: si se aplicara despues, el tema oscuro destellaria en blanco. -->
    <script src="src/tema.js?v=88635f9f"></script>
    <script src="src/lib/escapar.js?v=e0153e84"></script>
    <script src="src/lib/dialogo.js?v=c3def367"></script>
    <script src="src/lib/avisos.js?v=69830cdb"></script>
    <link rel="stylesheet" href="src/styles/fonts.css?v=6380d90a">
    <link rel="stylesheet" href="src/styles/icons.css?v=153b4184">
    
    <!-- Design System -->
    <link rel="stylesheet" href="src/styles/design-system.css?v=e05349f1">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="src/styles/navbar-styles.css?v=a0749ccb">
    <link rel="stylesheet" href="src/styles/dashboard-styles.css?v=ba7e6101">
    
</head>
<body>
    <!-- Barra de navegación unificada -->
    <div id="navbar-container"></div>

    <main class="dashboard-container" id="contenido" tabindex="-1">
        <!-- El encabezado era un título de dos líneas más un "Bienvenido/a Fulano -
             Administrador". El saludo no es información: el nombre y el rol ya están en
             la barra, y ocupaban la franja más valiosa de la pantalla. Lo que va acá es
             el estado del relevamiento, que es lo que alguien viene a mirar. -->
        <header class="inicio-header">
            <h1>Relevamiento</h1>
            <p class="inicio-fecha" id="inicio-fecha"></p>
        </header>

        <!-- Error de la pantalla (no se pudo verificar la sesión o cargar los datos): con
             salida, en lugar de un alert() que se cerraba y dejaba la página vacía. -->
        <div id="dash-error" hidden></div>

        <!-- Administrador y consultor: la foto completa del relevamiento, la
             actividad del equipo y el estado del comicio si hay uno cargado.
             Oculta por defecto: dashboard.js decide cuál de las dos vistas
             mostrar según el rol y recién ahí saca el "hidden". -->
        <div id="vista-admin-consultor" hidden>
            <!-- Situación: una cifra grande y tres apoyos. La jerarquía es de tamaño,
                 no de color, y por eso el porcentaje domina sin necesidad de un
                 azulejo. -->
            <section class="situacion" id="situacion" aria-label="Estado del relevamiento">
                <div class="situacion-cargando" role="status">Cargando…</div>
            </section>

            <!-- Dónde falta trabajo. Es el corte por circuito, que existía en la API
                 (`/api/padron/resultados/por-circuito`) y no se mostraba en ninguna
                 pantalla: es el único que dice en qué zona hay que ir a relevar. -->
            <section class="por-circuito" id="por-circuito" aria-label="Avance por circuito"></section>

            <!-- Sólo con admin.system: quién tocó qué, para no tener que abrir
                 Auditoría a mirar si pasó algo. -->
            <section class="actividad-reciente" id="actividad-reciente" aria-label="Actividad reciente"></section>

            <!-- Sólo con comicio.view, y sólo si hay al menos un comicio cargado. -->
            <section class="comicio-widget" id="comicio-widget" aria-label="Estado del comicio"></section>
        </div>

        <!-- Encargado de relevamiento: no tiene resultados.view, así que no puede ver
             nada de lo de arriba (son endpoints de /resultados/*). Su vista es su
             propio avance, sourced en /api/padron/estadisticas, que sí le
             corresponde, y un acceso directo a seguir cargando. -->
        <div id="vista-encargado" hidden>
            <section class="situacion" id="situacion-encargado" aria-label="Mi avance de relevamiento">
                <div class="situacion-cargando" role="status">Cargando…</div>
            </section>

            <section class="condiciones-pendientes" id="condiciones-pendientes" aria-label="Condiciones especiales"></section>

            <a class="cta-relevar" href="index.html?sinRelevar=1">
                <i class="fas fa-clipboard-list" aria-hidden="true"></i>
                <span>Seguir relevando</span>
                <i class="fas fa-arrow-right" aria-hidden="true"></i>
            </a>
        </div>

        <!-- Grid de Módulos del Sistema -->
        <section class="modulos" aria-label="Módulos del sistema">
            <h2 class="titulo-seccion">Módulos</h2>
            <div class="modules-grid" id="modules-grid"></div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="src/lib/estados.js?v=b3c74a8f"></script>
    <script src="src/components/NavbarComponent.js?v=5e08287d"></script>
    <script src="src/lib/opciones.js?v=c7d76c08"></script>
    <script src="src/services/ApiService.js?v=20eebc7b"></script>
    <script src="src/services/AuthService.js?v=a6ec8d65"></script>
    <script src="src/pages/dashboard.js?v=e5eb8eb0"></script>
</body>
</html>
