<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema Electoral</title>
    
    <!-- Tipografia e iconos, servidos desde este mismo origen -->
    <link rel="preload" href="/assets/fonts/inter-latin-400-normal.woff2?v=dd05e326" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/inter-latin-600-normal.woff2?v=62553d15" as="font" type="font/woff2" crossorigin>
    <!-- Antes del primer pintado: si se aplicara despues, el tema oscuro destellaria en blanco. -->
    <script src="src/tema.js?v=2e769770"></script>
    <script src="src/lib/escapar.js?v=e0153e84"></script>
    <link rel="stylesheet" href="src/styles/fonts.css?v=5bd875d5">
    <link rel="stylesheet" href="src/styles/icons.css?v=4119dcbe">
    
    <!-- Design System -->
    <link rel="stylesheet" href="src/styles/design-system.css?v=6d516238">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="src/styles/navbar-styles.css?v=23619bcd">
    <link rel="stylesheet" href="src/styles/padron-styles.css?v=19eacf86">
    
    <style>
        /* ==================================================================
           INICIO

           Tres bloques, en orden de respuesta: cuánto se lleva hecho, dónde
           falta, y a dónde ir. Antes era un saludo y una grilla de tarjetas
           grandes que sólo enlazaban a lo que ya estaba en la barra.
           ================================================================== */

        body {
            font-family: var(--ds-font-family);
            background-color: var(--ds-bg-page);
            color: var(--ds-text-primary);
            font-size: var(--ds-font-base);
            margin: 0;
            line-height: 1.55;
        }

        .dashboard-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px 48px;
        }

        /* ==================== ENCABEZADO ==================== */
        .inicio-header {
            padding: 8px 0 20px;
        }

        .inicio-header h1 {
            margin: 0;
            font-size: var(--ds-font-2xl);
            font-weight: var(--ds-weight-semibold);
            letter-spacing: var(--ds-tracking-tight);
        }

        .inicio-fecha {
            margin: 2px 0 0;
            color: var(--ds-text-muted);
            font-size: var(--ds-font-base);
            text-transform: capitalize;
        }

        /* ==================== SITUACIÓN ====================
           El porcentaje es la respuesta; las tres cifras son el respaldo. La
           jerarquía la da el tamaño (28px contra 13px), no el color: por eso
           funciona igual con el acento en grafito. */
        .situacion {
            background: var(--ds-bg-card);
            border: 1px solid var(--ds-border-light);
            border-radius: var(--ds-radius-md);
            padding: 20px 24px;
            margin-bottom: 20px;
        }

        .situacion-principal {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .situacion-porcentaje {
            font-size: 2.75rem;
            font-weight: var(--ds-weight-semibold);
            letter-spacing: -0.03em;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .situacion-porcentaje span {
            font-size: 1.25rem;
            color: var(--ds-text-muted);
            margin-left: 2px;
        }

        .situacion-detalle {
            flex: 1;
            min-width: 0;
        }

        .situacion-titulo {
            margin: 0 0 8px;
            color: var(--ds-text-secondary);
        }

        .situacion-barra {
            height: 8px;
            background: var(--ds-bg-muted);
            border-radius: var(--ds-radius-full);
            overflow: hidden;
        }

        .situacion-relleno {
            height: 100%;
            background: var(--ds-primary-600);
            border-radius: inherit;
        }

        .situacion-cifras {
            display: flex;
            gap: 32px;
            margin: 18px 0 0;
            padding-top: 16px;
            border-top: 1px solid var(--ds-border-light);
        }

        .situacion-cifras dt {
            font-size: var(--ds-font-xs);
            text-transform: uppercase;
            letter-spacing: var(--ds-tracking-wide);
            color: var(--ds-text-muted);
        }

        .situacion-cifras dd {
            margin: 2px 0 0;
            font-size: var(--ds-font-xl);
            font-weight: var(--ds-weight-medium);
            font-variant-numeric: tabular-nums;
        }

        .situacion-cargando,
        .situacion-error {
            color: var(--ds-text-muted);
            margin: 0;
        }

        /* ==================== TÍTULOS DE SECCIÓN ==================== */
        .titulo-seccion {
            margin: 0 0 2px;
            font-size: var(--ds-font-lg);
            font-weight: var(--ds-weight-semibold);
            letter-spacing: var(--ds-tracking-tight);
        }

        .titulo-ayuda {
            margin: 0 0 12px;
            color: var(--ds-text-muted);
            font-size: var(--ds-font-sm);
        }

        /* ==================== AVANCE POR CIRCUITO ====================
           Una fila por circuito, ordenadas de menos a más relevado, para que
           lo que falta quede arriba sin tener que buscarlo. Se eligió lista y
           no gráfico de barras porque hay que leer el número exacto: "cuántos
           faltan en el circuito 3" es una cantidad, no una proporción. */
        .por-circuito {
            background: var(--ds-bg-card);
            border: 1px solid var(--ds-border-light);
            border-radius: var(--ds-radius-md);
            padding: 20px 24px;
            margin-bottom: 20px;
        }

        .por-circuito:empty {
            display: none;
        }

        .circuitos {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .circuito {
            display: grid;
            grid-template-columns: 110px 1fr auto 44px;
            align-items: center;
            gap: 14px;
            padding: 9px 0;
            border-bottom: 1px solid var(--ds-border-light);
        }

        .circuito:last-child {
            border-bottom: none;
        }

        .circuito-nombre {
            font-weight: var(--ds-weight-medium);
        }

        .circuito-barra {
            height: 6px;
            background: var(--ds-bg-muted);
            border-radius: var(--ds-radius-full);
            overflow: hidden;
        }

        .circuito-relleno {
            display: block;
            height: 100%;
            background: var(--ds-primary-500);
            border-radius: inherit;
        }

        .circuito-cifra {
            color: var(--ds-text-muted);
            font-size: var(--ds-font-sm);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .circuito-pct {
            text-align: right;
            font-weight: var(--ds-weight-medium);
            font-variant-numeric: tabular-nums;
        }

        /* ==================== MÓDULOS ====================
           Dejaron de ser tarjetas de 320px con ícono de 60px, descripción y
           lista de features: eso es una portada de producto, y acá es un
           menú. Filas compactas que escalan cuando entren módulos nuevos, que
           es la razón por la que esta pantalla se mantiene. */
        .modulos {
            margin-top: 28px;
        }

        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }

        .module-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: var(--ds-bg-card);
            border: 1px solid var(--ds-border-light);
            border-radius: var(--ds-radius-md);
            text-decoration: none;
            color: inherit;
            transition: border-color var(--ds-transition-fast), background-color var(--ds-transition-fast);
        }

        .module-card:hover {
            border-color: var(--ds-border-strong);
            background: var(--ds-bg-subtle);
        }

        .module-card.disabled {
            opacity: 0.55;
            pointer-events: none;
        }

        .module-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            font-size: 1.05rem;
            color: var(--ds-text-secondary);
            background: var(--ds-bg-subtle);
            border-radius: var(--ds-radius-sm);
        }

        .module-card:hover .module-icon {
            background: var(--ds-bg-muted);
            color: var(--ds-text-primary);
        }

        .module-content h3 {
            margin: 0;
            font-size: var(--ds-font-base);
            font-weight: var(--ds-weight-medium);
        }

        .module-content p {
            margin: 1px 0 0;
            color: var(--ds-text-muted);
            font-size: var(--ds-font-sm);
            /* Dos lineas como maximo: es un menu, no una portada de producto. */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* La lista de funcionalidades de cada módulo se oculta: es texto de
           folleto dentro de un menú de navegación. El markup se conserva para
           no tocar renderModules(). */
        .module-features {
            display: none;
        }

        .module-status {
            display: none;
        }

        /* El estado va debajo del titulo y no al margen derecho: .module-content no
           es flex, asi que un margin-left:auto lo dejaba colgando bajo la descripcion. */
        .module-card.disabled .module-status {
            display: block;
            margin: 5px 0 0;
            font-size: var(--ds-font-xs);
            text-transform: uppercase;
            letter-spacing: var(--ds-tracking-wide);
            color: var(--ds-text-muted);
        }

        .module-card.disabled .module-status i {
            display: none;
        }

        @media (max-width: 640px) {
            .situacion-principal {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .situacion-detalle {
                width: 100%;
            }

            .situacion-cifras {
                gap: 20px;
            }

            .circuito {
                grid-template-columns: 90px 1fr 40px;
            }

            .circuito-cifra {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Barra de navegación unificada -->
    <div id="navbar-container"></div>

    <main class="dashboard-container">
        <!-- El encabezado era un título de dos líneas más un "Bienvenido/a Fulano -
             Administrador". El saludo no es información: el nombre y el rol ya están en
             la barra, y ocupaban la franja más valiosa de la pantalla. Lo que va acá es
             el estado del relevamiento, que es lo que alguien viene a mirar. -->
        <header class="inicio-header">
            <h1>Relevamiento</h1>
            <p class="inicio-fecha" id="inicio-fecha"></p>
        </header>

        <!-- Situación: una cifra grande y tres apoyos. La jerarquía es de tamaño, no de
             color, y por eso el porcentaje domina sin necesidad de un azulejo. -->
        <section class="situacion" id="situacion" aria-label="Estado del relevamiento">
            <div class="situacion-cargando">Cargando…</div>
        </section>

        <!-- Dónde falta trabajo. Es el corte por circuito, que existía en la API
             (`/api/padron/resultados/por-circuito`) y no se mostraba en ninguna
             pantalla: es el único que dice en qué zona hay que ir a relevar. -->
        <section class="por-circuito" id="por-circuito" aria-label="Avance por circuito"></section>

        <!-- Grid de Módulos del Sistema -->
        <section class="modulos" aria-label="Módulos del sistema">
            <h2 class="titulo-seccion">Módulos</h2>
            <div class="modules-grid" id="modules-grid"></div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="src/components/NavbarComponent.js?v=b370bbc8"></script>
    <script src="src/services/ApiService.js?v=32a50499"></script>
    <script src="src/services/AuthService.js?v=dbc5042e"></script>
    
    <script>
        // Configuración de módulos por rol
        const MODULES_CONFIG = {
            administrador: [
                {
                    id: 'padron',
                    title: 'Padrón Electoral',
                    description: 'Gestión completa del padrón electoral municipal con herramientas de relevamiento.',
                    icon: 'fa-users-cog',
                    href: 'index.html',
                    status: 'available',
                    features: [
                        'Consulta de votantes',
                        'Relevamiento de preferencias',
                        'Gestión de condiciones especiales',
                        'Exportación de datos'
                    ]
                },
                {
                    id: 'resultados',
                    title: 'Resultados y Estadísticas',
                    description: 'Análisis detallado de resultados del relevamiento con gráficos interactivos.',
                    icon: 'fa-chart-pie',
                    href: 'resultados.html',
                    status: 'available',
                    features: [
                        'Gráficos interactivos',
                        'Estadísticas por barrio',
                        'Análisis de tendencias',
                        'Reportes automáticos'
                    ]
                },
                {
                    id: 'fiscales',
                    title: 'Gestión de Fiscales',
                    description: 'Administración de fiscales de mesa y coordinadores de comicio.',
                    icon: 'fa-user-shield',
                    href: 'fiscales.html',
                    status: 'coming-soon',
                    features: [
                        'Registro de fiscales',
                        'Asignación de mesas',
                        'Capacitación online',
                        'Control de asistencia'
                    ]
                },
                {
                    id: 'comicio',
                    title: 'Gestión de Comicio',
                    description: 'Configuración y administración de lugares de votación y mesas electorales.',
                    icon: 'fa-building',
                    href: 'comicio.html',
                    status: 'coming-soon',
                    features: [
                        'Configuración de escuelas',
                        'Distribución de mesas',
                        'Logística electoral',
                        'Materiales de votación'
                    ]
                }
            ],
            encargado_relevamiento: [
                {
                    id: 'padron',
                    title: 'Relevamiento de Padrón',
                    description: 'Acceso a las herramientas de relevamiento del padrón electoral.',
                    icon: 'fa-clipboard-check',
                    href: 'index.html',
                    status: 'available',
                    features: [
                        'Carga de relevamientos',
                        'Actualización de datos',
                        'Consulta de votantes',
                        'Reportes de progreso'
                    ]
                }
            ],
            consultor: [
                {
                    id: 'resultados',
                    title: 'Estadísticas y Reportes',
                    description: 'Consulta de estadísticas y análisis de datos electorales.',
                    icon: 'fa-chart-bar',
                    href: 'resultados.html',
                    status: 'available',
                    features: [
                        'Dashboards interactivos',
                        'Reportes estadísticos',
                        'Análisis de tendencias',
                        'Exportación de gráficos'
                    ]
                }
            ]
        };

        // Estado de la aplicación
        let currentUser = null;
        let currentUserRole = null;
        let userPermissions = [];

        // Inicialización
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('🚀 Iniciando Dashboard...');
            console.log('📋 Servicios disponibles:', {
                authService: !!window.authService,
                apiService: !!window.apiService,
                navbarComponent: !!window.navbarComponent
            });
            
            try {
                // Inicializar navbar
                if (window.navbarComponent && typeof window.navbarComponent.init === 'function') {
                    window.navbarComponent.init('navbar-container', 'dashboard');
                    console.log('✅ Navbar inicializado');
                }

                // Verificar autenticación y obtener datos del usuario
                const isAuthenticated = await initAuth();
                console.log('🔐 Estado de autenticación:', isAuthenticated);
                
                if (!isAuthenticated) {
                    console.warn('⚠️ No autenticado - redirigiendo a index.html');
                    window.location.href = 'index.html';
                    return;
                }

                // Obtener información completa del usuario
                await loadUserInfo();
                console.log('👤 Usuario actual:', {
                    user: currentUser?.username,
                    role: currentUserRole,
                    permissions: userPermissions.length
                });

                // Cargar dashboard
                await loadDashboard();
                console.log('📊 Dashboard cargado con', userPermissions.length, 'permisos');
                
                console.log('✅ Dashboard iniciado correctamente');
                
            } catch (error) {
                console.error('❌ Error iniciando dashboard:', error);
                showError('Error al cargar el panel de control: ' + error.message);
            }
        });

        // Inicializar autenticación
        async function initAuth() {
            try {
                if (window.authService && window.authService.init) {
                    const isAuthenticated = await window.authService.init();
                    if (isAuthenticated) {
                        currentUser = window.authService.getCurrentUser();
                        return true;
                    }
                }
                return false;
            } catch (error) {
                console.error('Error en autenticación:', error);
                return false;
            }
        }

        // Obtener información completa del usuario desde el backend
        async function loadUserInfo() {
            try {
                const response = await window.apiService.request('/api/auth/me', {
                    method: 'GET'
                });

                if (response.success && response.data) {
                    currentUser = response.data;
                    currentUserRole = response.data.rol;
                    userPermissions = response.data.permisos || [];
                    
                    console.log('✅ Usuario cargado:', {
                        nombre: currentUser.nombre_completo,
                        rol: currentUserRole,
                        permisos: userPermissions
                    });
                    
                    updateUserInfo();
                } else {
                    throw new Error('No se pudo obtener información del usuario');
                }
            } catch (error) {
                console.error('❌ Error cargando información del usuario:', error);
                // Si falla, usar datos básicos del authService
                if (currentUser) {
                    currentUserRole = 'administrador'; // Fallback por defecto
                    // Asignar permisos por defecto para administrador
                    userPermissions = ['padron.view', 'padron.edit', 'padron.relevamiento', 'padron.export', 
                                     'resultados.view', 'resultados.export', 'fiscales.view', 'fiscales.edit',
                                     'comicio.view', 'comicio.edit', 'reportes.view'];
                    updateUserInfo();
                }
            }
        }

        // El nombre y el rol del usuario ya los muestra la barra de navegación en todas
        // las pantallas, así que el encabezado de esta dejó de repetirlos. Lo que sí
        // aporta es la fecha: ubica el estado que se está mirando en el tiempo.
        function updateUserInfo() {
            const fecha = document.getElementById('inicio-fecha');
            if (!fecha) return;
            fecha.textContent = new Date().toLocaleDateString('es-AR', {
                weekday: 'long', day: 'numeric', month: 'long', year: 'numeric',
            });
        }

        // Obtener nombre de rol para mostrar
        function getRoleDisplayName(role) {
            const roleNames = {
                'administrador': 'Administrador',
                'encargado_relevamiento': 'Encargado de Relevamiento',
                'consultor': 'Consultor'
            };
            return roleNames[role] || 'Usuario';
        }

        // Cargar dashboard según rol y permisos
        async function loadDashboard() {
            // Usar configuración basada en permisos
            const modules = getModulesForUser();
            renderModules(modules);
            
            // Cargar estadísticas si tiene permisos para ver padrón
            const hasAccessToPadron = hasPermission('padron.view');
            if (hasAccessToPadron) {
                await loadQuickStats();
            }
        }

        // Obtener módulos basados en los permisos del usuario
        function getModulesForUser() {
            const availableModules = [];

            // Módulo Dashboard (siempre disponible)
            
            // Módulo Padrón
            if (hasPermission('padron.view')) {
                availableModules.push({
                    id: 'padron',
                    title: 'Padrón Electoral',
                    description: 'Gestión del padrón electoral municipal con herramientas de relevamiento.',
                    icon: 'fa-users-cog',
                    href: 'index.html',
                    status: 'available',
                    features: getFeaturesByPermissions('padron')
                });
            }

            // Módulo Resultados/Estadísticas
            if (hasPermission('resultados.view')) {
                availableModules.push({
                    id: 'resultados',
                    title: 'Resultados y Estadísticas',
                    description: 'Análisis detallado de resultados del relevamiento con gráficos interactivos.',
                    icon: 'fa-chart-pie',
                    href: 'resultados.html',
                    status: 'available',
                    features: getFeaturesByPermissions('resultados')
                });
            }

            // Módulo Fiscales (futuro)
            if (hasPermission('fiscales.view')) {
                availableModules.push({
                    id: 'fiscales',
                    title: 'Gestión de Fiscales',
                    description: 'Administración de fiscales de mesa y coordinadores de comicio.',
                    icon: 'fa-user-shield',
                    href: 'fiscales.html',
                    status: 'coming-soon',
                    features: getFeaturesByPermissions('fiscales')
                });
            }

            // Módulo Comicio (futuro)
            if (hasPermission('comicio.view')) {
                availableModules.push({
                    id: 'comicio',
                    title: 'Gestión de Comicio',
                    description: 'Configuración y administración de lugares de votación y mesas electorales.',
                    icon: 'fa-building',
                    href: 'comicio.html',
                    status: 'coming-soon',
                    features: getFeaturesByPermissions('comicio')
                });
            }

            // Módulo Usuarios (solo admin)
            if (hasPermission('usuarios.view') || hasPermission('usuarios.edit') || currentUserRole === 'administrador') {
                availableModules.push({
                    id: 'usuarios',
                    title: 'Gestión de Usuarios',
                    description: 'Administración de cuentas de usuario, asignación de roles y permisos del sistema.',
                    icon: 'fa-users-gear',
                    href: 'usuarios.html',
                    status: 'available',
                    features: [
                        'Crear y editar cuentas',
                        'Asignación de roles',
                        'Activar/desactivar usuarios',
                        'Resetear contraseñas'
                    ]
                });
            }

            return availableModules;
        }

        // Verificar si el usuario tiene un permiso específico
        function hasPermission(permission) {
            return userPermissions.includes(permission);
        }

        // Obtener características del módulo según permisos
        function getFeaturesByPermissions(module) {
            const featureMap = {
                padron: {
                    'padron.view': 'Consulta de votantes',
                    'padron.edit': 'Modificación de datos',
                    'padron.relevamiento': 'Relevamiento de preferencias',
                    'padron.export': 'Exportación de datos'
                },
                resultados: {
                    'resultados.view': 'Gráficos interactivos',
                    'resultados.export': 'Reportes automáticos'
                },
                fiscales: {
                    'fiscales.view': 'Consulta de fiscales',
                    'fiscales.edit': 'Gestión completa'
                },
                comicio: {
                    'comicio.view': 'Consulta de lugares',
                    'comicio.edit': 'Gestión completa'
                }
            };

            const moduleFeatures = featureMap[module] || {};
            const availableFeatures = [];

            for (const [permission, feature] of Object.entries(moduleFeatures)) {
                if (hasPermission(permission)) {
                    availableFeatures.push(feature);
                }
            }

            return availableFeatures.length > 0 ? availableFeatures : ['Acceso básico'];
        }

        // Renderizar módulos
        function renderModules(modules) {
            const container = document.getElementById('modules-grid');
            if (!container) return;

            container.innerHTML = modules.map(module => `
                <a href="${module.href}" class="module-card ${module.id} ${module.status === 'coming-soon' ? 'disabled' : ''}"
                   onclick="${module.status === 'coming-soon' ? 'return false;' : ''}">
                    <div class="module-icon">
                        <i class="fas ${module.icon}"></i>
                    </div>
                    <div class="module-content">
                        <h3>${module.title}</h3>
                        <p>${module.description}</p>
                        <ul class="module-features">
                            ${module.features.map(feature => `
                                <li><i class="fas fa-check-circle"></i> ${feature}</li>
                            `).join('')}
                        </ul>
                        <span class="module-status ${module.status}">
                            <i class="fas ${module.status === 'available' ? 'fa-check-circle' : 'fa-clock'}"></i>
                            ${module.status === 'available' ? 'Disponible' : 'Próximamente'}
                        </span>
                    </div>
                </a>
            `).join('');
        }

        // Cargar estadísticas rápidas
        /**
         * Situación del relevamiento.
         *
         * Antes esta función devolvía datos inventados —1250 votantes, 890 relevados—
         * con un TODO al lado, y la sección que los mostraba estaba comentada. Ahora
         * consulta la misma API que el padrón.
         */
        async function loadQuickStats() {
            const contenedor = document.getElementById('situacion');
            const numero = valor => Number(valor || 0).toLocaleString('es-AR');

            try {
                const respuesta = await window.apiService.request('/api/padron/resultados/estadisticas-avanzadas');
                const d = respuesta?.data || {};

                const total = Number(d.total_votantes) || 0;
                const relevados = Number(d.total_relevados) || 0;
                const pendientes = Math.max(total - relevados, 0);
                const porcentaje = total > 0 ? Math.round((relevados / total) * 100) : 0;

                contenedor.innerHTML = `
                    <div class="situacion-principal">
                        <div class="situacion-porcentaje">${porcentaje}<span>%</span></div>
                        <div class="situacion-detalle">
                            <p class="situacion-titulo">del padrón relevado</p>
                            <div class="situacion-barra" role="progressbar" aria-valuenow="${porcentaje}"
                                 aria-valuemin="0" aria-valuemax="100" aria-label="Avance del relevamiento">
                                <div class="situacion-relleno" style="width: ${porcentaje}%"></div>
                            </div>
                        </div>
                    </div>
                    <dl class="situacion-cifras">
                        <div><dt>Relevados</dt><dd>${numero(relevados)}</dd></div>
                        <div><dt>Pendientes</dt><dd>${numero(pendientes)}</dd></div>
                        <div><dt>Padrón total</dt><dd>${numero(total)}</dd></div>
                    </dl>
                `;

                await cargarPorCircuito();
            } catch (error) {
                console.error('Error cargando la situacion:', error);
                contenedor.innerHTML = '<p class="situacion-error">No se pudo cargar el estado del relevamiento.</p>';
            }
        }

        /**
         * Avance por circuito, ordenado de menos a más relevado.
         *
         * Este corte ya existía en la API y no se mostraba en ninguna pantalla. Es el
         * único que responde *dónde* falta trabajo, que es la pregunta que sigue a
         * "cuánto falta": el resto de los cortes —sexo, edad, condiciones— describen a
         * quién se relevó, pero no dicen adónde ir mañana.
         */
        async function cargarPorCircuito() {
            const contenedor = document.getElementById('por-circuito');
            if (!contenedor) return;

            try {
                const respuesta = await window.apiService.request('/api/padron/resultados/por-circuito');
                const filas = Array.isArray(respuesta?.data) ? respuesta.data : [];
                if (filas.length === 0) return;

                const conAvance = filas.map(f => {
                    const total = Number(f.total_votantes) || 0;
                    const relevados = Number(f.total_relevados) || 0;
                    return { circuito: f.circuito, total, relevados, pct: total > 0 ? Math.round((relevados / total) * 100) : 0 };
                }).sort((a, b) => a.pct - b.pct);

                contenedor.innerHTML = `
                    <h2 class="titulo-seccion">Avance por circuito</h2>
                    <p class="titulo-ayuda">Ordenado de menor a mayor avance: los primeros son los que faltan.</p>
                    <ul class="circuitos">
                        ${conAvance.map(c => `
                            <li class="circuito">
                                <span class="circuito-nombre">Circuito ${c.circuito}</span>
                                <span class="circuito-barra">
                                    <span class="circuito-relleno" style="width: ${c.pct}%"></span>
                                </span>
                                <span class="circuito-cifra">${c.relevados.toLocaleString('es-AR')} / ${c.total.toLocaleString('es-AR')}</span>
                                <span class="circuito-pct">${c.pct}%</span>
                            </li>
                        `).join('')}
                    </ul>
                `;
            } catch (error) {
                console.error('Error cargando el avance por circuito:', error);
            }
        }

        // Mostrar errores
        function showError(message) {
            console.error('❌ Error:', message);
            // TODO: Implementar sistema de notificaciones
            alert('Error: ' + message);
        }
    </script>
</body>
</html>
