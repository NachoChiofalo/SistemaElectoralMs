<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema Electoral</title>
    
    <!-- Tipografia e iconos, servidos desde este mismo origen -->
    <link rel="preload" href="/assets/fonts/inter-latin-400-normal.woff2?v=dd05e326" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/inter-latin-600-normal.woff2?v=62553d15" as="font" type="font/woff2" crossorigin>
    <!-- Antes del primer pintado: si se aplicara despues, el tema oscuro destellaria en blanco. -->
    <script src="src/tema.js?v=2e769770"></script>
    <script src="src/lib/escapar.js?v=e0153e84"></script>
    <link rel="stylesheet" href="src/styles/fonts.css?v=5bd875d5">
    <link rel="stylesheet" href="src/styles/icons.css?v=f5a99c05">
    
    <!-- Design System -->
    <link rel="stylesheet" href="src/styles/design-system.css?v=6d516238">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="src/styles/navbar-styles.css?v=23619bcd">
    <link rel="stylesheet" href="src/styles/padron-styles.css?v=19eacf86">
    
    <style>
        /* ==================================================================
           INICIO

           Tres bloques, en orden de respuesta: cuánto se lleva hecho, dónde
           falta, y a dónde ir. Antes era un saludo y una grilla de tarjetas
           grandes que sólo enlazaban a lo que ya estaba en la barra.
           ================================================================== */

        body {
            font-family: var(--ds-font-family);
            background-color: var(--ds-bg-page);
            color: var(--ds-text-primary);
            font-size: var(--ds-font-base);
            margin: 0;
            line-height: 1.55;
        }

        .dashboard-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px 48px;
        }

        /* ==================== ENCABEZADO ==================== */
        .inicio-header {
            padding: 8px 0 20px;
        }

        .inicio-header h1 {
            margin: 0;
            font-size: var(--ds-font-2xl);
            font-weight: var(--ds-weight-semibold);
            letter-spacing: var(--ds-tracking-tight);
        }

        .inicio-fecha {
            margin: 2px 0 0;
            color: var(--ds-text-muted);
            font-size: var(--ds-font-base);
            text-transform: capitalize;
        }

        /* ==================== SITUACIÓN ====================
           El porcentaje es la respuesta; las tres cifras son el respaldo. La
           jerarquía la da el tamaño (28px contra 13px), no el color: por eso
           funciona igual con el acento en grafito. */
        .situacion {
            background: var(--ds-bg-card);
            border: 1px solid var(--ds-border-light);
            border-radius: var(--ds-radius-md);
            padding: 20px 24px;
            margin-bottom: 20px;
        }

        .situacion-principal {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .situacion-porcentaje {
            font-size: 2.75rem;
            font-weight: var(--ds-weight-semibold);
            letter-spacing: -0.03em;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }

        .situacion-porcentaje span {
            font-size: 1.25rem;
            color: var(--ds-text-muted);
            margin-left: 2px;
        }

        .situacion-detalle {
            flex: 1;
            min-width: 0;
        }

        .situacion-titulo {
            margin: 0 0 8px;
            color: var(--ds-text-secondary);
        }

        .situacion-barra {
            height: 8px;
            background: var(--ds-bg-muted);
            border-radius: var(--ds-radius-full);
            overflow: hidden;
        }

        .situacion-relleno {
            height: 100%;
            background: var(--ds-primary-600);
            border-radius: inherit;
        }

        .situacion-cifras {
            display: flex;
            gap: 32px;
            margin: 18px 0 0;
            padding-top: 16px;
            border-top: 1px solid var(--ds-border-light);
        }

        .situacion-cifras dt {
            font-size: var(--ds-font-xs);
            text-transform: uppercase;
            letter-spacing: var(--ds-tracking-wide);
            color: var(--ds-text-muted);
        }

        .situacion-cifras dd {
            margin: 2px 0 0;
            font-size: var(--ds-font-xl);
            font-weight: var(--ds-weight-medium);
            font-variant-numeric: tabular-nums;
        }

        .situacion-cargando,
        .situacion-error {
            color: var(--ds-text-muted);
            margin: 0;
        }

        /* ==================== TÍTULOS DE SECCIÓN ==================== */
        .titulo-seccion {
            margin: 0 0 2px;
            font-size: var(--ds-font-lg);
            font-weight: var(--ds-weight-semibold);
            letter-spacing: var(--ds-tracking-tight);
        }

        .titulo-ayuda {
            margin: 0 0 12px;
            color: var(--ds-text-muted);
            font-size: var(--ds-font-sm);
        }

        /* ==================== AVANCE POR CIRCUITO ====================
           Una fila por circuito, ordenadas de menos a más relevado, para que
           lo que falta quede arriba sin tener que buscarlo. Se eligió lista y
           no gráfico de barras porque hay que leer el número exacto: "cuántos
           faltan en el circuito 3" es una cantidad, no una proporción. */
        .por-circuito {
            background: var(--ds-bg-card);
            border: 1px solid var(--ds-border-light);
            border-radius: var(--ds-radius-md);
            padding: 20px 24px;
            margin-bottom: 20px;
        }

        .por-circuito:empty {
            display: none;
        }

        .circuitos {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .circuito {
            display: grid;
            grid-template-columns: 110px 1fr auto 44px;
            align-items: center;
            gap: 14px;
            padding: 9px 0;
            border-bottom: 1px solid var(--ds-border-light);
        }

        .circuito:last-child {
            border-bottom: none;
        }

        .circuito-nombre {
            font-weight: var(--ds-weight-medium);
        }

        .circuito-barra {
            height: 6px;
            background: var(--ds-bg-muted);
            border-radius: var(--ds-radius-full);
            overflow: hidden;
        }

        .circuito-relleno {
            display: block;
            height: 100%;
            background: var(--ds-primary-500);
            border-radius: inherit;
        }

        .circuito-cifra {
            color: var(--ds-text-muted);
            font-size: var(--ds-font-sm);
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        .circuito-pct {
            text-align: right;
            font-weight: var(--ds-weight-medium);
            font-variant-numeric: tabular-nums;
        }

        /* ==================== MÓDULOS ====================
           Dejaron de ser tarjetas de 320px con ícono de 60px, descripción y
           lista de features: eso es una portada de producto, y acá es un
           menú. Filas compactas que escalan cuando entren módulos nuevos, que
           es la razón por la que esta pantalla se mantiene. */
        .modulos {
            margin-top: 28px;
        }

        .modules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }

        .module-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: var(--ds-bg-card);
            border: 1px solid var(--ds-border-light);
            border-radius: var(--ds-radius-md);
            text-decoration: none;
            color: inherit;
            transition: border-color var(--ds-transition-fast), background-color var(--ds-transition-fast);
        }

        .module-card:hover {
            border-color: var(--ds-border-strong);
            background: var(--ds-bg-subtle);
        }

        .module-card.disabled {
            opacity: 0.55;
            pointer-events: none;
        }

        .module-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            font-size: 1.05rem;
            color: var(--ds-text-secondary);
            background: var(--ds-bg-subtle);
            border-radius: var(--ds-radius-sm);
        }

        .module-card:hover .module-icon {
            background: var(--ds-bg-muted);
            color: var(--ds-text-primary);
        }

        .module-content h3 {
            margin: 0;
            font-size: var(--ds-font-base);
            font-weight: var(--ds-weight-medium);
        }

        .module-content p {
            margin: 1px 0 0;
            color: var(--ds-text-muted);
            font-size: var(--ds-font-sm);
            /* Dos lineas como maximo: es un menu, no una portada de producto. */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* La lista de funcionalidades de cada módulo se oculta: es texto de
           folleto dentro de un menú de navegación. El markup se conserva para
           no tocar renderModules(). */
        .module-features {
            display: none;
        }

        .module-status {
            display: none;
        }

        /* El estado va debajo del titulo y no al margen derecho: .module-content no
           es flex, asi que un margin-left:auto lo dejaba colgando bajo la descripcion. */
        .module-card.disabled .module-status {
            display: block;
            margin: 5px 0 0;
            font-size: var(--ds-font-xs);
            text-transform: uppercase;
            letter-spacing: var(--ds-tracking-wide);
            color: var(--ds-text-muted);
        }

        .module-card.disabled .module-status i {
            display: none;
        }

        @media (max-width: 640px) {
            .situacion-principal {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .situacion-detalle {
                width: 100%;
            }

            .situacion-cifras {
                gap: 20px;
            }

            .circuito {
                grid-template-columns: 90px 1fr 40px;
            }

            .circuito-cifra {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Barra de navegación unificada -->
    <div id="navbar-container"></div>

    <main class="dashboard-container">
        <!-- El encabezado era un título de dos líneas más un "Bienvenido/a Fulano -
             Administrador". El saludo no es información: el nombre y el rol ya están en
             la barra, y ocupaban la franja más valiosa de la pantalla. Lo que va acá es
             el estado del relevamiento, que es lo que alguien viene a mirar. -->
        <header class="inicio-header">
            <h1>Relevamiento</h1>
            <p class="inicio-fecha" id="inicio-fecha"></p>
        </header>

        <!-- Situación: una cifra grande y tres apoyos. La jerarquía es de tamaño, no de
             color, y por eso el porcentaje domina sin necesidad de un azulejo. -->
        <section class="situacion" id="situacion" aria-label="Estado del relevamiento">
            <div class="situacion-cargando">Cargando…</div>
        </section>

        <!-- Dónde falta trabajo. Es el corte por circuito, que existía en la API
             (`/api/padron/resultados/por-circuito`) y no se mostraba en ninguna
             pantalla: es el único que dice en qué zona hay que ir a relevar. -->
        <section class="por-circuito" id="por-circuito" aria-label="Avance por circuito"></section>

        <!-- Grid de Módulos del Sistema -->
        <section class="modulos" aria-label="Módulos del sistema">
            <h2 class="titulo-seccion">Módulos</h2>
            <div class="modules-grid" id="modules-grid"></div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="src/components/NavbarComponent.js?v=34e0318c"></script>
    <script src="src/services/ApiService.js?v=7942aab6"></script>
    <script src="src/services/AuthService.js?v=dbc5042e"></script>
    <script src="src/pages/dashboard.js?v=bd687717"></script>
</body>
</html>
