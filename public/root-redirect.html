<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirigiendo... - Sistema Electoral</title>
    <!-- Esta página no carga ninguna hoja de estilo, a propósito: redirige en el acto y
         bajar el design system para mostrar un destello sería trabajo tirado. Por eso
         los valores van literales acá y no como var(--ds-*), que no resolverían. Si se
         cambia el navy institucional, este es el único lugar que hay que tocar a mano. -->
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #334e68 0%, #243b53 50%, #102a43 100%);
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            text-align: center;
        }
        .loading {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        .logo {
            font-size: 3rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div>
        <!-- Sin icons.css cargado, un <i class="fas"> no dibujaba nada. El SVG va inline. -->
        <div class="logo" aria-hidden="true">
            <svg width="56" height="56" viewBox="0 0 576 512" fill="currentColor">
                <path d="M96 80c0-26.5 21.5-48 48-48H432c26.5 0 48 21.5 48 48V384H96V80zm313 47c-9.4-9.4-24.6-9.4-33.9 0l-111 111-47-47c-9.4-9.4-24.6-9.4-33.9 0s-9.4 24.6 0 33.9l64 64c9.4 9.4 24.6 9.4 33.9 0L409 161c9.4-9.4 9.4-24.6 0-33.9zM0 336c0-26.5 21.5-48 48-48H64V416H512V288h16c26.5 0 48 21.5 48 48v96c0 26.5-21.5 48-48 48H48c-26.5 0-48-21.5-48-48V336z"/>
            </svg>
        </div>
        <h2>Sistema Electoral</h2>
        <p class="loading">Redirigiendo al dashboard...</p>
    </div>
    
    <script>
        // Redirigir inmediatamente al dashboard
        window.location.replace('dashboard.html');
    </script>
</body>
</html>
