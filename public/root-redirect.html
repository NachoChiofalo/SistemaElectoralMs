<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirigiendo... - ÁGORA</title>
    <link rel="icon" type="image/png" href="/assets/images/agora-icon.png">
    <!-- Esta página no carga ninguna hoja de estilo, a propósito: redirige en el acto y
         bajar el design system para mostrar un destello sería trabajo tirado. Por eso
         los valores van literales acá y no como var(--ds-*), que no resolverían. Si se
         cambia la identidad (ver docs/IDENTIDAD.md), este es el único lugar que hay que
         tocar a mano: acá el fondo alternativo #202020 y el blanco de la "versión
         invertida" van literales, sin degradado -- los degradados institucionales ya
         no existen en ningún otro lado de la interfaz. -->
    <style>
        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #202020;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #ffffff;
            text-align: center;
        }
        .loading {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
        .logo {
            font-size: 3rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div>
        <!-- Sin icons.css cargado, un <i class="fas"> no dibujaba nada. El SVG va inline. -->
        <div class="logo" aria-hidden="true">
            <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="2" width="6" height="8" rx="1"/>
                <path d="M10.5 6 11.5 7 13.5 4.7"/>
                <path d="M4 10h5M15 10h5"/>
                <path d="M4 10 7 20h10l3-10"/>
                <path d="M7.5 14q4.5 2.5 9 0"/>
                <path d="M7.5 17q4.5 2.5 9 0"/>
            </svg>
        </div>
        <h2>ÁGORA</h2>
        <p class="loading">Redirigiendo al dashboard...</p>
    </div>
    
    <script src="src/pages/root-redirect.js?v=f9687d36"></script>
</body>
</html>
