<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - Sistema Electoral</title>

    <!-- Tipografia e iconos, servidos desde este mismo origen -->
    <link rel="preload" href="/assets/fonts/inter-latin-400-normal.woff2?v=dd05e326" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/inter-latin-600-normal.woff2?v=62553d15" as="font" type="font/woff2" crossorigin>
    <!-- Antes del primer pintado: si se aplicara despues, el tema oscuro destellaria en blanco. -->
    <script src="src/tema.js?v=2e769770"></script>
    <script src="src/lib/escapar.js?v=e0153e84"></script>
    <link rel="stylesheet" href="src/styles/fonts.css?v=5bd875d5">
    <link rel="stylesheet" href="src/styles/icons.css?v=4119dcbe">

    <!-- Design System -->
    <link rel="stylesheet" href="src/styles/design-system.css?v=6d516238">

    <!-- Estilos -->
    <link rel="stylesheet" href="src/styles/navbar-styles.css?v=23619bcd">
    <link rel="stylesheet" href="src/styles/usuarios-styles.css?v=6259e477">

    <style>
        body {
            font-family: var(--ds-font-family);
            background-color: var(--ds-bg-page);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        .page-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px 20px;
        }
    </style>
</head>
<body>
    <!-- Barra de navegacion unificada -->
    <div id="navbar-container"></div>

    <main class="page-container">
        <div id="usuarios-container">
            <!-- UsuariosComponent se renderiza aqui -->
        </div>
    </main>

    <!-- Scripts -->
    <script src="src/components/NavbarComponent.js?v=b370bbc8"></script>
    <script src="src/services/ApiService.js?v=32a50499"></script>
    <script src="src/services/AuthService.js?v=dbc5042e"></script>
    <script src="src/components/UsuariosComponent.js?v=d6f1602c"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // Inicializar navbar
                if (window.navbarComponent) {
                    window.navbarComponent.init('navbar-container', 'usuarios');
                }

                // Verificar autenticacion
                if (window.authService && window.authService.init) {
                    const isAuthenticated = await window.authService.init();
                    if (!isAuthenticated) {
                        window.location.href = 'index.html';
                        return;
                    }
                }

                // Verificar que es administrador
                const response = await window.apiService.request('/api/auth/me', { method: 'GET' });
                if (!response.success || response.data.rol !== 'administrador') {
                    alert('Acceso denegado: se requieren permisos de administrador');
                    window.location.href = 'dashboard.html';
                    return;
                }

                // Inicializar componente de usuarios
                await window.usuariosComponent.init('usuarios-container');

            } catch (error) {
                console.error('Error iniciando pagina de usuarios:', error);
                alert('Error al cargar la pagina: ' + error.message);
            }
        });
    </script>
</body>
</html>
