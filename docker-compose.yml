# Entorno local del Sistema Electoral.
#
# De seis servicios (gateway, auth, padron, web-admin, postgres, redis) a uno.
#
# La base de produccion vive en Supabase: para trabajar contra ella alcanza con poner
# DATABASE_URL en el .env y levantar solo `app`. El servicio `postgres` de abajo esta
# en un perfil opcional, para desarrollar sin conexion o sin tocar datos reales.
#
#   docker compose up app                      -> contra Supabase (DATABASE_URL)
#   docker compose --profile local up          -> contra un Postgres en el contenedor

services:
  app:
    build: .
    container_name: sistema-electoral
    ports:
      - "${PORT:-8080}:8080"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-}
      # Solo se usan si DATABASE_URL esta vacio (perfil local).
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-sistema_electoral}
      DB_USER: ${DB_USER:-electoral_user}
      DB_PASSWORD: ${DB_PASSWORD:-electoral_password}
      DB_POOL_MAX: ${DB_POOL_MAX:-8}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET es obligatorio}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-2h}
      REFRESH_TOKEN_EXPIRATION: ${REFRESH_TOKEN_EXPIRATION:-7d}
      INACTIVITY_TIMEOUT_MINUTES: ${INACTIVITY_TIMEOUT_MINUTES:-30}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    restart: unless-stopped
    # Un solo proceso es un punto unico de falla: el reinicio automatico y el
    # healthcheck son lo que lo compensan.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 384M

  postgres:
    profiles: ["local"]
    image: postgres:15-alpine
    container_name: electoral-db
    environment:
      POSTGRES_DB: ${DB_NAME:-sistema_electoral}
      POSTGRES_USER: ${DB_USER:-electoral_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-electoral_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-electoral_user} -d ${DB_NAME:-sistema_electoral}"]
      interval: 10s
      timeout: 5s
      retries: 5

# Se elimino el servicio redis: estaba declarado y ningun servicio lo usaba. La cache
# de sesiones y de resultados vive en el proceso, que es correcto mientras haya una
# sola instancia.
volumes:
  postgres_data:
