# Render Blueprint - Sistema Electoral
# https://render.com/docs/blueprint-spec
#
# De tres servicios web (auth, padron, gateway) a uno. La base sigue siendo Supabase,
# por DATABASE_URL.

services:
  - type: web
    name: sistema-electoral
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health

    # Las migraciones corren antes de arrancar, no dentro del proceso. Si fallan, el
    # deploy se detiene en lugar de levantar contra un esquema desactualizado.
    preDeployCommand: npm run migrate

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"

      # Cadena de conexion de Supabase. Conviene usar el pooler (puerto 6543) en lugar
      # de la conexion directa: Render abre y cierra instancias y el pooler absorbe eso.
      - key: DATABASE_URL
        sync: false

      - key: DB_POOL_MAX
        value: "8"

      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: "2h"
      - key: REFRESH_TOKEN_EXPIRATION
        value: "7d"
      - key: INACTIVITY_TIMEOUT_MINUTES
        value: "30"

      # Render termina TLS en su proxy: un solo salto por delante.
      - key: TRUST_PROXY
        value: "1"

      - key: LOG_LEVEL
        value: info

      # Ajustar al plan contratado. En el plan free (512 MB) 256 deja margen para el
      # resto del proceso.
      - key: NODE_OPTIONS
        value: "--max-old-space-size=256"
