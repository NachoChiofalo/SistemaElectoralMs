# Render Blueprint - Sistema Electoral
# https://render.com/docs/blueprint-spec
#
# De tres servicios web (auth, padron, gateway) a uno. La base sigue siendo Supabase,
# por DATABASE_URL.

services:
  - type: web
    name: sistema-electoral
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health

    # El plan free no soporta preDeployCommand (se implementa como un "one-off job",
    # y el plan free no permite jobs de una sola ejecucion). La alternativa correcta
    # para Docker es correr la migracion como parte del propio arranque del
    # contenedor, antes de levantar el servidor.
    #
    # El `exec` importa: sin el, `node` queda como hijo del shell y una senal SIGTERM
    # (la que manda Render al reciclar la instancia, reenviada por tini) puede no
    # llegarle — el apagado ordenado de server.js nunca se ejecutaria. Con `exec`,
    # node REEMPLAZA al shell en el mismo PID y recibe la senal directo.
    #
    # Correr `npm run migrate` en cada arranque es intencional, no un descuido: en el
    # plan free el servicio se duerme a los 15 min sin trafico y se reinicia en el
    # proximo request, asi que esto se ejecuta seguido. Las migraciones son
    # idempotentes (verificado) y el runner ya trackea que esta aplicado, asi que el
    # caso normal es un puñado de SELECT contra schema_migrations, no trabajo real.
    #
    # Si en el futuro se pasa a un plan pago, preDeployCommand es la opcion mas
    # prolija (separa migrar de arrancar, y un fallo de migracion no reinicia en loop
    # al servicio ya corriendo).
    dockerCommand: sh -c "npm run migrate && exec node src/server.js"

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"

      # Cadena de conexion de Supabase. Conviene usar el pooler (puerto 6543) en lugar
      # de la conexion directa: Render abre y cierra instancias y el pooler absorbe eso.
      - key: DATABASE_URL
        sync: false

      - key: DB_POOL_MAX
        value: "8"

      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: "2h"
      - key: REFRESH_TOKEN_EXPIRATION
        value: "7d"
      - key: INACTIVITY_TIMEOUT_MINUTES
        value: "30"

      # Render termina TLS en su proxy: un solo salto por delante.
      - key: TRUST_PROXY
        value: "1"

      - key: LOG_LEVEL
        value: info

      # Ajustar al plan contratado. En el plan free (512 MB) 256 deja margen para el
      # resto del proceso.
      - key: NODE_OPTIONS
        value: "--max-old-space-size=256"
